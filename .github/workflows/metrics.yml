# Measure and compare the base and head trees inside the bounded gate
# container; the runner only shows the summary. See .github/ci/README.md.
name: metrics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job's status is the check metrics/complexity; no job holds a token
  # that can write.
  complexity:
    name: metrics/complexity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GATE: metrics/complexity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Reads .prototools and installs moon 2.6.5.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      # atelier-metrics is built on the runner as a static musl binary and
      # runs in the container; rust-code-analysis lives in the gate image.
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      # Measures and compares both trees; its exit status is the job's.
      - name: Measure and compare both trees in the container
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          GATES: metrics/complexity
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash "$CI_SUPPORT/run.sh" metrics
      # Shows the container's table, after a failed comparison too. It only
      # reports: a missing summary fails this step, not the job.
      - name: Summarize complexity
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ runner.temp }}/atelier-reports/container/summary.txt
        run: |
          if [[ ! -f "$SUMMARY" ]]; then
            echo "::error::the container wrote no complexity summary at $SUMMARY"
            exit 1
          fi
          cat -- "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  performance:
    name: metrics/performance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GATE: metrics/performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      - name: Measure and compare both trees in the container
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          GATES: metrics/performance
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash "$CI_SUPPORT/run.sh" metrics
      - name: Summarize performance
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ runner.temp }}/atelier-reports/container/summary.txt
        run: |
          if [[ ! -f "$SUMMARY" || -L "$SUMMARY" || ! -s "$SUMMARY" ]]; then
            echo "::error::the container wrote no performance summary at $SUMMARY"
            exit 1
          fi
          cat -- "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  # Reports CPU time, peak memory, allocations, binary size and dependency
  # facts for both trees; it never fails on what it measures.
  resources:
    name: metrics/resources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GATE: metrics/resources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      - name: Measure both trees' resources in the container
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          GATES: metrics/resources
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash "$CI_SUPPORT/run.sh" metrics
      - name: Summarize resources
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ runner.temp }}/atelier-reports/container/summary.txt
        run: |
          if [[ ! -f "$SUMMARY" || -L "$SUMMARY" || ! -s "$SUMMARY" ]]; then
            echo "::error::the container wrote no resources summary at $SUMMARY"
            exit 1
          fi
          cat -- "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  # A controlled A/B of the allocation patch. The trusted container measures
  # the PR base in both runs; only the untrusted head container sees the
  # patch. The patched head's DHAT TotalBlocks must exceed the unpatched
  # head's, so a later PR that changes the reporter's allocations still
  # passes. Both runs must exit 0.
  resources-proof:
    name: metrics/resources-proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GATE: metrics/resources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      - name: Verify the allocation count
        shell: bash
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          GATES: metrics/resources
          # The real PR base: the trusted container measures it in both runs.
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          # Three runs of two containers each fit inside the 90-minute job.
          # The measured runs finish well under this; the cap keeps a runaway
          # from consuming the proof job.
          METRICS_CONTAINER_LIMIT: 8m
        run: |
          reports="$RUNNER_TEMP/atelier-reports/container"
          summary="$reports/summary.txt"
          json="$reports/resources.json"
          head_json="$reports/head-resources.json"
          status=0

          fail() {
            echo "::error::$run: $* (exit $status)"
            exit 1
          }

          echo "### metrics/resources-proof" >> "$GITHUB_STEP_SUMMARY"

          # Appends this run's summary under the heading $1, so the evidence of
          # every run that measured stays visible when a later assertion fails.
          show() {
            {
              echo
              echo "#### $1"
              echo
              cat -- "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Runs the resources gate against BASE and requires exit 0 and an
          # allocations row in the summary.
          measure() {
            local log="$RUNNER_TEMP/resources-proof-$run.log"
            status=0
            bash "$CI_SUPPORT/run.sh" metrics > "$log" 2>&1 || status=$?
            cat -- "$log"
            [[ "$status" == 0 ]] || fail "expected exit 0"
            [[ -f "$summary" && ! -L "$summary" && -s "$summary" ]] \
              || fail "no resources summary at $summary"
            grep -Eiq '^\| *allocations' "$summary" \
              || fail "expected an allocations row in the summary"
          }

          # Requires the table cell $2, named $1, to show the measured value
          # $3. A whole cell must equal it exactly; a decimal one, which the
          # table rounds to six places, must lie within 0.000001 of it.
          check_cell() {
            local name=$1 cell=$2 value=$3 kind=$4
            local number='^[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'

            if [[ "$kind" == whole ]]; then
              [[ "$value" =~ ^[0-9]+$ ]] \
                || fail "$name measured '$value' is not a whole number"
              [[ "$cell" =~ ^[0-9]+$ ]] \
                || fail "$name cell '$cell' is not a whole number"
              (( 10#$cell == 10#$value )) \
                || fail "$name cell $cell is not the measured $value"
              return
            fi

            [[ "$value" =~ $number ]] \
              || fail "$name measured '$value' is not a number"
            [[ "$cell" =~ $number ]] \
              || fail "$name cell '$cell' is not a number"
            awk -v cell="$cell" -v value="$value" 'BEGIN {
              d = cell - value
              if (d < 0) d = -d
              exit !(d <= 0.000001)
            }' || fail "$name cell $cell is not within 0.000001 of the" \
              "measured $value"
          }

          # Requires the summary row for metric $1 to show field $2 of
          # resources.json before and of head-resources.json after, as $3:
          # whole or decimal, and leaves its after cell in row_after.
          check_row() {
            local metric=$1 field=$2 kind=$3 base head cells before after
            base=$(jq -er ".$field" "$json") \
              || fail "no $field in resources.json"
            head=$(jq -er ".$field" "$head_json") \
              || fail "no $field in head-resources.json"

            cells=$(awk -F'|' -v metric="$metric" '
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              trim($2) == metric {
                print trim($3) "\t" trim($4)
                found = 1
                exit
              }
              END { exit !found }
            ' "$summary") || fail "no $metric row in the summary"
            IFS=$'\t' read -r before after <<< "$cells"

            check_cell "$metric before" "$before" "$base" "$kind"
            check_cell "$metric after" "$after" "$head" "$kind"
            row_after=$after
          }

          # Requires the summary row for metric $1 to show the idle note in
          # both cells: idle_note of resources.json before and of
          # head-resources.json after. The row holds text, not a number.
          check_text_row() {
            local metric=$1 base head cells before after
            base=$(jq -er '.idle_note' "$json") \
              || fail "no idle_note in resources.json"
            head=$(jq -er '.idle_note' "$head_json") \
              || fail "no idle_note in head-resources.json"

            cells=$(awk -F'|' -v metric="$metric" '
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              trim($2) == metric {
                print trim($3) "\t" trim($4)
                found = 1
                exit
              }
              END { exit !found }
            ' "$summary") || fail "no $metric row in the summary"
            IFS=$'\t' read -r before after <<< "$cells"

            [[ "$before" == "$base" ]] \
              || fail "$metric before cell '$before' is not note '$base'"
            [[ "$after" == "$head" ]] \
              || fail "$metric after cell '$after' is not note '$head'"
          }

          # Requires the crate rows, in the table's order, to name each crate
          # in either report's top five, head's first, and to show its size
          # in each, or "-" where that side does not list it.
          check_crates() {
            local expected actual i label base head row_label before after
            local -a want got
            expected=$(jq -nr --slurpfile base "$json" \
              --slurpfile head "$head_json" '
              def cell: gsub("[^A-Za-z0-9_.\\[\\]-]"; "?");
              def size($side; $name):
                [$side.crates[] | select(.name == $name) | .size][0]
                | if . == null then "-" else tostring end;

              $base[0] as $b
              | $head[0] as $h
              | [$h.crates[].name, $b.crates[].name]
              | reduce .[] as $n ([];
                  if any(.[]; . == $n) then . else . + [$n] end)
              | .[]
              | "Crate \(cell) (text bytes, top five)\t\(size($b; .))"
                + "\t\(size($h; .))"
            ') || fail "cannot read the crates of resources.json and" \
              "head-resources.json"
            actual=$(awk -F'|' '
              function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
              trim($2) ~ /^Crate .* \(text bytes, top five\)$/ {
                print trim($2) "\t" trim($3) "\t" trim($4)
              }
            ' "$summary")
            mapfile -t want <<< "$expected"
            mapfile -t got <<< "$actual"

            (( ${#got[@]} == ${#want[@]} )) \
              || fail "the summary has ${#got[@]} crate rows, expected" \
                "${#want[@]}"

            for i in "${!want[@]}"; do
              IFS=$'\t' read -r label base head <<< "${want[i]}"
              IFS=$'\t' read -r row_label before after <<< "${got[i]}"
              [[ "$row_label" == "$label" ]] \
                || fail "crate row $((i + 1)) is '$row_label', expected" \
                  "'$label'"

              if [[ "$base" == - ]]; then
                [[ "$before" == - ]] \
                  || fail "$label before cell '$before' should be -"
              else
                check_cell "$label before" "$before" "$base" whole
              fi

              if [[ "$head" == - ]]; then
                [[ "$after" == - ]] \
                  || fail "$label after cell '$after' should be -"
              else
                check_cell "$label after" "$after" "$head" whole
              fi
            done
          }

          # Requires every row of the run's table to show the measured values
          # of resources.json before and head-resources.json after, and reads
          # head's TotalBlocks and the Allocations (blocks) after cell for the
          # runs to compare.
          verify_table() {
            local idle_note
            check_row "CPU time (s)" cpu_seconds decimal
            check_row "Peak memory (bytes)" peak_rss_bytes decimal
            check_row "Allocations (bytes)" total_bytes whole
            check_row "Allocations (blocks)" total_blocks whole
            table_after=$row_after
            check_row "Binary size (file bytes)" binary_file_size whole
            check_row "Binary size (text bytes)" text_section_size whole
            check_row "Packages" package_count whole
            check_row "Workspace members" workspace_members whole
            check_row "Duplicate versions" duplicate_versions whole
            check_row "Startup time (s)" startup_seconds decimal
            check_row "Build time (s)" build_seconds decimal
            check_row "Voluntary context switches" gnu_voluntary_ctxt_switches whole
            check_row "Maximum resident set size (kbytes)" gnu_max_rss_kib whole
            check_row "File system outputs" gnu_fs_outputs whole
            idle_note=$(jq -er '.idle_note' "$head_json") \
              || fail "no idle_note in head-resources.json"
            if [[ -z "$idle_note" ]]; then
              check_row "Idle footprint (KiB)" idle_footprint_kib whole
              check_row "Voluntary context switches over idle window" \
                voluntary_ctxt_switches whole
              check_row "Bytes written (wchar)" wchar_bytes whole
              check_row "Sampled peak threads, every 100 ms" \
                sampled_peak_threads whole
              check_row "Sampled peak FDs, every 100 ms" sampled_peak_fds whole
            else
              check_text_row "Idle footprint (KiB)"
              check_text_row "Voluntary context switches over idle window"
              check_text_row "Bytes written (wchar)"
              check_text_row "Sampled peak threads, every 100 ms"
              check_text_row "Sampled peak FDs, every 100 ms"
            fi
            check_crates
            head_blocks=$(jq -er '.total_blocks' "$head_json") \
              || fail "no total_blocks in head-resources.json"
          }

          # The base tree is identical in all three runs; only head's working
          # tree changes. A gate that wrote head into resources.json (the
          # table's before column) changes these base values, so save them in
          # the control run and require the two runs below to match. The
          # deterministic fields must match exactly; CPU time and peak memory
          # are hyperfine means over timed runs, so they get a 25% tolerance.
          base_fields=(total_bytes total_blocks binary_file_size \
            text_section_size package_count workspace_members \
            duplicate_versions crates)
          tolerant_fields=(cpu_seconds peak_rss_bytes)
          # Startup, build, idle footprint, context switches, bytes written
          # and sampled peaks are timed or sampled and would flake across
          # runs, so check_base does not compare them.

          # Requires every base-side field of this run's resources.json to
          # match the control run's, naming $run and the field on a mismatch.
          # Deterministic fields must be equal; the two timed fields must lie
          # within 25% of the control run's value.
          check_base() {
            local field expected actual
            for field in "${base_fields[@]}"; do
              expected=$(jq -e --arg f "$field" '.[$f]' <<< "$control_base") \
                || fail "control base has no $field"
              actual=$(jq -e --arg f "$field" '.[$f]' "$json") \
                || fail "no $field in resources.json"
              [[ "$expected" == "$actual" ]] \
                || fail "base field $field is '$actual', expected" \
                  "'$expected' from the control run"
            done

            for field in "${tolerant_fields[@]}"; do
              expected=$(jq -e --arg f "$field" '.[$f]' <<< "$control_base") \
                || fail "control base has no $field"
              actual=$(jq -e --arg f "$field" '.[$f]' "$json") \
                || fail "no $field in resources.json"
              awk -v expected="$expected" -v actual="$actual" 'BEGIN {
                if (expected + 0 == 0) exit !(actual + 0 == 0)
                d = (actual - expected) / expected
                if (d < 0) d = -d
                exit !(d <= 0.25)
              }' || fail "base field $field is '$actual', more than 25%" \
                "from '$expected' in the control run"
            done
          }

          # Run 1, control: the unpatched head against the PR base. The
          # fixture's config declares a long-running process, so all three
          # runs sample the five idle fields from /proc, not a note.
          run=control
          fixture_dir="$SOURCE/tests/fixtures/metrics-idle"
          fixture_config="$fixture_dir/.moon/config/metrics.toml"
          [[ -f "$fixture_config" && ! -L "$fixture_config" ]] \
            || fail "no metrics-idle fixture config at $fixture_config"
          cp -- "$fixture_config" "$SOURCE/.moon/config/metrics.toml" \
            || fail "cannot copy the fixture config into $SOURCE"
          measure
          show Control
          verify_table

          # The declared process must really have been sampled in /proc:
          # require a positive footprint, at least one thread and FD, and
          # enough wchar output to show a process ran. Bounds, not timings.
          footprint=$(jq -er '.idle_footprint_kib' "$head_json") \
            || fail "no idle_footprint_kib in head-resources.json"
          (( footprint > 0 )) \
            || fail "head idle_footprint_kib $footprint is not above 0"
          threads=$(jq -er '.sampled_peak_threads' "$head_json") \
            || fail "no sampled_peak_threads in head-resources.json"
          (( threads >= 1 )) \
            || fail "head sampled_peak_threads $threads is below 1"
          fds=$(jq -er '.sampled_peak_fds' "$head_json") \
            || fail "no sampled_peak_fds in head-resources.json"
          (( fds >= 1 )) \
            || fail "head sampled_peak_fds $fds is below 1"
          wchar=$(jq -er '.wchar_bytes' "$head_json") \
            || fail "no wchar_bytes in head-resources.json"
          (( wchar >= 1000 )) \
            || fail "head wchar_bytes $wchar is below 1000"

          control_base=$(jq -c '{
            cpu_seconds, peak_rss_bytes, total_bytes, total_blocks,
            binary_file_size, text_section_size, package_count,
            workspace_members, duplicate_versions, crates
          }' "$json") || fail "cannot read the base fields from resources.json"
          control=$head_blocks
          control_table_after=$table_after
          # Run 2 must write its own evidence, not inherit run 1's.
          rm -rf -- "$reports"

          # Patches head's working tree only, which only the untrusted head
          # container measures; the trusted side reads BASE from git.
          run=allocated
          python3 - "$SOURCE/reporter/src/report.rs" <<'PY' || exit 1
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          # Any whitespace, including line breaks, may separate the tokens, so
          # rustfmt can wrap the parameters or the return type. The parameters
          # hold no brace or semicolon, so one match never spans two items.
          signature = re.compile(
              r"^[ \t]*pub\s+fn\s+results\s*\([^{};]*\)"
              r"\s*->\s*Vec\s*<\s*GateCheck\s*>\s*\{",
              re.MULTILINE,
          )
          found = list(signature.finditer(text))
          if len(found) != 1:
              print(
                  f"::error::allocated expected one results() signature in {path},"
                  f" found {len(found)}"
              )
              sys.exit(1)
          # The allocation goes on the lines after the one holding the
          # signature's opening brace.
          end = text.find("\n", found[0].end())
          if end < 0:
              print(f"::error::allocated found no line after results() in {path}")
              sys.exit(1)
          lines = [
              "    let extra: Vec<usize> ="
              " (0..report.actions.len().saturating_mul(8).max(1)).collect();",
              "    std::hint::black_box(&extra);",
              "    drop(extra);",
          ]
          path.write_text(text[: end + 1] + "\n".join(lines) + "\n" + text[end + 1 :])
          PY

          # Run 2, allocated: the patched head against the same PR base.
          measure
          show Allocated
          verify_table
          check_base
          allocated=$head_blocks

          (( allocated > control )) \
            || fail "expected allocated head TotalBlocks $allocated" \
              "above control $control"
          (( 10#$table_after > 10#$control_table_after )) \
            || fail "expected the allocated table's Allocations (blocks)" \
              "after cell $table_after above the control table's" \
              "after cell $control_table_after"
          # Run 3 must write its own evidence, not inherit run 2's.
          rm -rf -- "$reports"

          # Run 3, restored: head's own report.rs again, against the same PR
          # base; head's count must return to the control run's.
          run=restored
          git -C "$SOURCE" checkout -- reporter/src/report.rs \
            || fail "cannot restore reporter/src/report.rs"
          measure
          show Restored
          verify_table
          check_base
          restored=$head_blocks

          {
            echo
            echo "Head TotalBlocks: control $control, allocated $allocated," \
              "restored $restored"
          } >> "$GITHUB_STEP_SUMMARY"

          (( restored == control )) \
            || fail "expected restored head TotalBlocks $restored to equal" \
              "control $control"

  budget-proof:
    name: metrics/budget-proof (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [slowdown, restored, head-raises]
    env:
      GATE: metrics/performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      - name: Verify the performance gate verdict
        shell: bash
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          # Compare head with the tree it merges into, as the performance job
          # does, so the proof measures two different trees.
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PROOF_MODE: ${{ matrix.mode }}
        run: |
          expected_status=0
          expected_verdict=passed
          if [[ "$PROOF_MODE" == slowdown ]]; then
            expected_status=1
            expected_verdict=failed

            # The slowdown patches the measured function itself in head's
            # working tree, so the proof is a genuine regression rather than
            # a repeated call. The base tree comes from git at BASE, unpatched.
            python3 - "$SOURCE/reporter/src/report.rs" <<'PY' || exit 1
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          signature = (
              "pub fn results(report: &CiReport, gates: &[String])"
              " -> Vec<GateCheck> {"
          )
          lines = path.read_text().split("\n")
          found = [i for i, line in enumerate(lines) if line.strip() == signature]
          if len(found) != 1:
              print(
                  f"::error::slowdown expected one results() signature in {path},"
                  f" found {len(found)}"
              )
              sys.exit(1)
          lines[found[0] + 1 : found[0] + 1] = [
              "    for i in 0..256 {",
              "        std::hint::black_box(i);",
              "    }",
          ]
          path.write_text("\n".join(lines))
          PY
          fi

          # head-raises loosens head's own budget to 99%; the gate must still
          # apply the base's 5%.
          if [[ "$PROOF_MODE" == head-raises ]]; then
            printf '%s\n' 'instruction_limit_percent = 99' \
              > "$SOURCE/.moon/config/metrics.toml"
          fi

          status=0
          bash "$CI_SUPPORT/run.sh" metrics || status=$?
          summary="$RUNNER_TEMP/atelier-reports/container/summary.txt"
          if [[ "$status" != "$expected_status" ]] \
            || ! grep -Fxq "budget: $expected_verdict" "$summary"; then
            echo "::error::$PROOF_MODE expected budget: $expected_verdict" \
              "(exit $expected_status), got exit $status"
            exit 1
          fi

          if [[ "$PROOF_MODE" == head-raises ]]; then
            applied='limit: instruction_limit_percent 5 from base (base 5, head 99)'
            if ! grep -Fxq "$applied" "$summary"; then
              echo "::error::head-raises expected '$applied' in the summary"
              exit 1
            fi
          fi
          cat -- "$summary" >> "$GITHUB_STEP_SUMMARY"

  # Adds a benchmark that only head declares, so the gate judges it against
  # the absolute new_bench_instruction_ir budget: over sets the budget to 1
  # Ir and must fail, under keeps 20000 and must pass, and no-budget removes
  # the key so neither tree sets one and the gate must fail closed.
  # dependency proves a PR that adds a dependency builds and is measured.
  new-bench-proof:
    name: metrics/new-bench-proof (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [over, under, no-budget, dependency]
    env:
      GATE: metrics/performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      - name: Verify the head-only benchmark budget
        shell: bash
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PROOF_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$PROOF_MODE" == dependency ]]; then
            python3 - "$SOURCE/reporter/Cargo.toml" <<'PY' || exit 1
          import pathlib
          import sys
          import tomllib

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          if "itoa" in tomllib.loads(text)["dependencies"]:
              print(f"::error::dependency found itoa already declared in {path}")
              sys.exit(1)

          lines = text.split("\n")
          start = lines.index("[dependencies]") + 1
          end = next(
              (i for i in range(start, len(lines)) if lines[i].startswith("[")),
              len(lines),
          )
          while end > start and not lines[end - 1].strip():
              end -= 1

          lines.insert(end, 'itoa = "1"')
          path.write_text("\n".join(lines))
          PY
            cargo generate-lockfile --manifest-path "$SOURCE/Cargo.toml"
          else
            # head_only is a copy of the reporter benchmark under a name the
            # base's manifest does not declare, so it has no base count.
            cp -- "$SOURCE/reporter/benches/library_benchmark.rs" \
              "$SOURCE/reporter/benches/head_only.rs"
            python3 - "$SOURCE/reporter/Cargo.toml" <<'PY' || exit 1
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          if any(line.strip() == 'name = "head_only"' for line in text.split("\n")):
              print(f"::error::new-bench-proof found a head_only bench in {path}")
              sys.exit(1)
          if not text.endswith("\n"):
              text += "\n"
          text += '\n[[bench]]\nname = "head_only"\nharness = false\n'
          path.write_text(text)
          PY

            # Head's budget for the mode: over lowers it to 1 Ir, under keeps
            # 20000, no-budget removes only that key and keeps the 5% limit.
            python3 - "$SOURCE/.moon/config/metrics.toml" "$PROOF_MODE" \
              <<'PY' || exit 1
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          mode = sys.argv[2]
          lines = path.read_text().split("\n")
          key = re.compile(r"\s*new_bench_instruction_ir\s*=")
          found = [i for i, line in enumerate(lines) if key.match(line)]
          if len(found) != 1:
              print(
                  f"::error::{mode} expected one new_bench_instruction_ir"
                  f" in {path}, found {len(found)}"
              )
              sys.exit(1)
          if mode == "over":
              lines[found[0]] = "new_bench_instruction_ir = 1"
          elif mode == "no-budget":
              del lines[found[0]]
          elif lines[found[0]].strip() != "new_bench_instruction_ir = 20000":
              print("::error::under expected new_bench_instruction_ir = 20000")
              sys.exit(1)
          path.write_text("\n".join(lines))
          PY
          fi

          # no-budget must not rest on the real base lacking the key: once main
          # sets new_bench_instruction_ir, the base would supply a budget. Its
          # base is a local commit on HEAD whose tree holds head's config with
          # the key removed, so neither tree sets one. HEAD and the working
          # tree stay as they are; head_only stays out of that commit.
          proof_base=$BASE
          if [[ "$PROOF_MODE" == no-budget ]]; then
            config=.moon/config/metrics.toml
            index="$RUNNER_TEMP/no-budget.index"
            GIT_INDEX_FILE=$index git -C "$SOURCE" read-tree HEAD
            GIT_INDEX_FILE=$index git -C "$SOURCE" update-index -- "$config"
            tree=$(GIT_INDEX_FILE=$index git -C "$SOURCE" write-tree)
            proof_base=$(
              git -C "$SOURCE" -c user.name=proof \
                -c user.email=proof@example.invalid \
                commit-tree "$tree" -p HEAD -m "proof: no new-bench budget"
            )
            base_config=$(git -C "$SOURCE" show "$proof_base:$config")
            if grep -q 'new_bench_instruction_ir' <<< "$base_config"; then
              echo "::error::no-budget base still sets new_bench_instruction_ir"
              exit 1
            fi
          fi

          log="$RUNNER_TEMP/new-bench-proof.log"
          summary="$RUNNER_TEMP/atelier-reports/container/summary.txt"
          status=0
          BASE=$proof_base bash "$CI_SUPPORT/run.sh" metrics > "$log" 2>&1 \
            || status=$?
          cat -- "$log"
          if [[ -f "$summary" ]]; then
            cat -- "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

          fail() {
            echo "::error::$PROOF_MODE: $* (exit $status)"
            exit 1
          }
          case "$PROOF_MODE" in
            over)
              [[ "$status" == 1 ]] || fail "expected exit 1"
              grep -Fq 'new benchmark head_only' "$summary" \
                || fail "expected 'new benchmark head_only' in the summary"
              grep -Fxq 'budget: failed' "$summary" \
                || fail "expected 'budget: failed' in the summary"
              ;;
            under)
              [[ "$status" == 0 ]] || fail "expected exit 0"
              grep -Fq 'new benchmark head_only' "$summary" \
                || fail "expected 'new benchmark head_only' in the summary"
              grep -Fxq 'budget: passed' "$summary" \
                || fail "expected 'budget: passed' in the summary"
              ;;
            no-budget)
              # Fail closed: a head-only benchmark with no budget in either
              # tree fails the gate rather than passing unjudged.
              [[ "$status" == 1 ]] || fail "expected exit 1"
              grep -Fq 'neither tree sets' "$log" \
                || fail "expected 'neither tree sets' in the log"
              ;;
            dependency)
              [[ "$status" == 0 ]] || fail "expected exit 0"
              grep -Fxq 'budget: passed' "$summary" \
                || fail "expected 'budget: passed' in the summary"
              grep -q '^limit: instruction_limit_percent ' "$summary" \
                || fail "expected the instruction limit in the summary"
              ;;
            *)
              fail "unknown mode"
              ;;
          esac

  # Runs head's benchmark ten times with ASLR allowed, as metrics/performance
  # does, and requires the total Callgrind Ir to spread by under 0.5 percent,
  # so address layout cannot move a count near the budget.
  aslr-spread:
    name: metrics/aslr-spread
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GATE: metrics/spread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Build atelier-metrics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-metrics \
            --target x86_64-unknown-linux-musl
      - name: Measure head ten times in the container
        env:
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
          SOURCE: ${{ github.workspace }}
          GATES: metrics/spread
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash "$CI_SUPPORT/run.sh" metrics
      - name: Require an Ir spread under 0.5 percent
        shell: bash
        env:
          SPREAD: ${{ runner.temp }}/atelier-reports/container/spread.txt
        run: |
          if [[ ! -f "$SPREAD" || -L "$SPREAD" || ! -s "$SPREAD" ]]; then
            echo "::error::the container wrote no Ir values at $SPREAD"
            exit 1
          fi

          # Ten whole positive counts; any other line fails before the spread.
          measured=$(awk '
            !/^[0-9]+$/ { bad = "line " NR " is not a whole Ir count"; exit }
            NR == 1 || $1 + 0 < min + 0 { min = $1 }
            NR == 1 || $1 + 0 > max + 0 { max = $1 }
            END {
              if (bad == "" && NR != 10) bad = NR " Ir values, not 10"
              if (bad == "" && min + 0 <= 0) bad = "the smallest Ir is 0"
              if (bad != "") { print bad > "/dev/stderr"; exit 1 }
              printf "%s %s %.6f\n", min, max, (max - min) * 100 / min
            }
          ' "$SPREAD") || {
            echo "::error::spread.txt does not hold ten Ir counts"
            exit 1
          }
          read -r min max spread <<< "$measured"

          {
            echo "### metrics/aslr-spread"
            echo
            echo "Ir spread: $spread% (min $min, max $max; limit 0.5%)"
            echo
            echo '```text'
            cat -- "$SPREAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! awk -v spread="$spread" 'BEGIN { exit !(spread + 0 < 0.5) }'; then
            echo "::error::Ir spread $spread% is not under 0.5%" \
              "(min $min, max $max)"
            exit 1
          fi
          echo "Ir spread $spread% (min $min, max $max)"
