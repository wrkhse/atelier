# Records the released atelier build running its rust/fmt gate end to end,
# as a two-pane terminal GIF. CI only: scripts/record.sh refuses to run
# anywhere but a GitHub-hosted Linux runner, and every gate run goes through
# the contained runner in .github/ci. The recording shows the release asset
# for RELEASE_TAG and nothing else: a missing asset, checksum or version
# fails the job. The supervisor reviews its frames before attaching the GIF
# to the release.
name: record

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release candidate tag to record, such as v0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: record-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  record:
    # A release run that did not succeed published nothing worth recording.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history brings every tag, so the release's tag can be found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve the release tag
        id: release
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == workflow_dispatch ]]; then
            tag=$INPUT_TAG
          else
            tag=$HEAD_REF
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "$tag is not a release candidate tag; skipping recording"
            exit 0
          fi

          if [[ "$EVENT" == workflow_run ]]; then
            tag_sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")

            if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "release candidate tag $tag does not point at $HEAD_SHA" >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Reads .prototools and installs moon 2.6.5, as gates.yml does.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        if: steps.release.outputs.tag != ''
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.release.outputs.tag != ''
        with:
          toolchain: 1.100.0
          components: rustfmt,clippy
      - name: Install the recording tools
        if: steps.release.outputs.tag != ''
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            tmux ffmpeg ripgrep fonts-dejavu-core fontconfig
          fc-cache -f
      # terminal-control builds with Zig 0.15.2, checked before it is used.
      - name: Install Zig
        if: steps.release.outputs.tag != ''
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          curl -fsSLO \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          sha='02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239'
          echo "$sha  zig-x86_64-linux-0.15.2.tar.xz" | sha256sum -c -
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Install terminal-control
        if: steps.release.outputs.tag != ''
        run: |
          set -euo pipefail

          cargo install --locked terminal-control --version 1.2.1
          termctrl --version
      - name: Record the released gate
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/record.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.tag != ''
        with:
          name: slice-1-recording
          path: slice-1.gif
          if-no-files-found: error
