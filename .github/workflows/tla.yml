# The TLA+ experiment of #71: one atelier race, read as a spec, checked by
# two model checkers that are neither part of atelier nor required by it.
# It runs in the shape of atelier's gates — a bounded, non-root, offline
# container on a GitHub-hosted runner — but it is not a gate: it changes
# neither gates.yml nor .github/ci, it needs no branch protection entry,
# and neither checker runs on a developer's machine. specs/tla/README.md
# describes the experiment and how to read its result.
name: tla

on:
  pull_request:
    paths:
      - "specs/tla/**"
      - ".github/workflows/tla.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TLC and everystate (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image from the pinned tools
        run: docker build --file specs/tla/Dockerfile --tag atelier-tla specs/tla

      - name: Check the spec and its broken variant in the container
        run: |
          set -euo pipefail
          docker run --rm \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 4096 \
            --memory 4g \
            --memory-swap 4g \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/specs/tla,target=/specs,readonly" \
            atelier-tla | tee "$RUNNER_TEMP/tla.log"

      - name: Put the result in the job summary
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          {
            echo "## TLA+ experiment (not required)"
            echo
            if [ -s "$RUNNER_TEMP/tla.log" ]; then
              grep '^tla: ' "$RUNNER_TEMP/tla.log" | sed 's/^tla: //' || true
            else
              echo "The container wrote no output; the job log has the error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tla-log
          # The image build can fail before a check runs, and then there is no
          # log to keep; this workflow is not a gate, so a missing one warns.
          if-no-files-found: warn
          path: ${{ runner.temp }}/tla.log
