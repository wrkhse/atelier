# Packages the atelier-reporter and atelier-metrics binaries for each
# release candidate, with pinned actions and a container smoke test.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/image-resolve.yml
    permissions:
      contents: read
      packages: read
    with:
      bootstrap: ${{ github.event.pull_request.number == 123 && '1' || '0' }}
    secrets: inherit
  build:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: linux-x64
          - target: aarch64-apple-darwin
            os: macos-15
            archive: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GATE_IMAGE: ghcr.io/${{ github.repository }}-gates@${{
        needs.image.outputs.digest }}
      GATE_IMAGE_HEAD: ${{ needs.image.outputs.head-ref == 'local' && 'local' ||
        format('ghcr.io/{0}-gates@{1}', github.repository,
        needs.image.outputs.digest) }}
      GATE_IMAGE_BOOTSTRAP: ${{ needs.image.outputs.bootstrap }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          target: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          cargo build --release --locked \
            -p atelier-reporter \
            -p atelier-metrics \
            --target "$TARGET"
      - name: Verify version matches tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          expected="${TAG#v}"
          cargo metadata --locked --no-deps --format-version 1 | \
            python3 -c '
          import json
          import sys

          names = ("atelier-reporter", "atelier-metrics")
          expected = sys.argv[1]
          packages = json.load(sys.stdin)["packages"]

          for name in names:
              version = next(
                  p["version"] for p in packages if p["name"] == name
              )
              if version != expected:
                  sys.exit(
                      f"{name} version {version} does not match tag {expected}"
                  )
          ' "$expected"
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage/.moon/tasks" "$stage/.moon/scripts" "$stage/bin"

          # Consumers define their own project mappings in .moon/workspace.yml.
          cp .moon/tasks/rust.yml "$stage/.moon/tasks/rust.yml"
          cp .moon/toolchains.yml "$stage/.moon/toolchains.yml"
          cp .moon/scripts/msrv.sh "$stage/.moon/scripts/msrv.sh"
          cp .moon/scripts/mutants.sh "$stage/.moon/scripts/mutants.sh"
          cp .prototools "$stage/.prototools"
          cp "target/$TARGET/release/atelier-reporter" "$stage/bin/atelier-reporter"
          cp "target/$TARGET/release/atelier-metrics" "$stage/bin/atelier-metrics"
          cp README.md "$stage/README.md"
          cp LICENSE "$stage/LICENSE"

          mkdir -p dist
          tar -czf "dist/atelier-$TAG-$ARCHIVE.tar.gz" -C "$stage" \
            .moon/tasks/rust.yml \
            .moon/toolchains.yml \
            .moon/scripts/msrv.sh \
            .moon/scripts/mutants.sh \
            .prototools \
            bin/atelier-reporter \
            bin/atelier-metrics \
            README.md \
            LICENSE
      # Reads .prototools and installs the pinned moon version for the query.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - name: Smoke test the archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
          CI_SUPPORT: ${{ github.workspace }}/.github/ci
        run: |
          set -euo pipefail

          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          unpacked="$smoke/unpacked"
          mkdir "$unpacked"
          tar -xzf "dist/atelier-$TAG-$ARCHIVE.tar.gz" -C "$unpacked"

          for path in \
            .moon/tasks/rust.yml \
            .moon/toolchains.yml \
            .moon/scripts/msrv.sh \
            .moon/scripts/mutants.sh \
            .prototools \
            bin/atelier-reporter \
            bin/atelier-metrics \
            README.md \
            LICENSE; do
            if [[ ! -f "$unpacked/$path" || -L "$unpacked/$path" ]]; then
              echo "archive is missing $path as a plain file" >&2
              exit 1
            fi
          done

          "$unpacked/bin/atelier-reporter" --help
          "$unpacked/bin/atelier-metrics" --version

          # Give the packaged preset a consumer workspace with one Rust crate.
          consumer="$smoke/consumer"
          mkdir -p "$consumer/.moon" "$consumer/app/src"
          cd "$consumer"
          git init -q -b main
          cp -R "$unpacked/.moon/tasks" "$unpacked/.moon/scripts" .moon/
          cp "$unpacked/.moon/toolchains.yml" .moon/
          cp "$unpacked/.prototools" .

          cat > Cargo.toml <<'EOF'
          [workspace]
          members = ["app"]
          resolver = "3"

          [workspace.package]
          rust-version = "1.100"
          EOF
          cat > app/Cargo.toml <<'EOF'
          [package]
          name = "app"
          version = "0.1.0"
          edition = "2024"
          rust-version.workspace = true
          EOF
          cat > .moon/workspace.yml <<'EOF'
          projects:
            app: "app"

          vcs:
            defaultBranch: "main"
          EOF
          printf 'language: rust\n' > app/moon.yml
          cat > app/src/lib.rs <<'EOF'
          pub fn answer() -> u32 {
              42
          }
          EOF

          # The contained runner only supports GitHub-hosted Linux.
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Give moon ci a base commit and a change to format-check.
            git -c user.name=smoke -c user.email=smoke@invalid \
              commit -qm 'Seed smoke history' --allow-empty
            git add .moon .prototools Cargo.toml app
            git -c user.name=smoke -c user.email=smoke@invalid \
              commit -qm 'Add smoke app'

            reporter_dir=target/x86_64-unknown-linux-musl/release
            mkdir -p "$reporter_dir"
            cp "$unpacked/bin/atelier-reporter" "$reporter_dir/"

            SOURCE="$consumer" GATE=rust/fmt GATES=rust/fmt BASE="" \
              bash "$CI_SUPPORT/run.sh" gate

            report="$RUNNER_TEMP/atelier-reports/container/ci-report.json"
            if [[ ! -s "$report" ]]; then
              echo "smoke gate wrote no report at $report" >&2
              exit 1
            fi

            "$unpacked/bin/atelier-reporter" --report "$report" --gate rust/fmt
          fi

          moon --version
          moon query tasks | python3 -c '
          import json
          import sys

          tasks = json.load(sys.stdin)["tasks"].get("app", {})
          expected = {"fmt", "clippy", "test", "kani", "miri", "mutants", "msrv"}
          missing = expected - tasks.keys()

          if missing:
              names = ", ".join(sorted(missing))
              sys.exit(f"archive preset is missing tasks: {names}")
          '
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atelier-${{ github.ref_name }}-${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: atelier-*
          path: dist
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -t tarballs < <(find dist -type f -name '*.tar.gz' | sort)

          if [[ "${#tarballs[@]}" -ne 2 ]]; then
            echo "expected 2 release tarballs, found ${#tarballs[@]}" >&2
            exit 1
          fi

          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "atelier $TAG" \
            --notes "Rust moon gates release candidate" \
            "${tarballs[@]}" dist/SHA256SUMS

  skip:
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Explain skip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "Tag $TAG is not a release candidate" \
            "(expected v*-rc.*); skipping publish."
