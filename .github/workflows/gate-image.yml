# Publishes the gate image from main. Other refs pull this image by digest,
# so a gate does not compile the gate tools on every run.
name: gate image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the gate image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # docker/setup-buildx-action v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build, push and record the gate image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}-gates
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

          docker buildx build --push \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:$SHA_TAG" \
            --file .github/ci/Dockerfile \
            .github/ci

          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA_TAG" \
            --format '{{.Manifest.Digest}}')
          if [[ -z "$digest" ]]; then
            echo "::error::no digest for $IMAGE:$SHA_TAG after the push"
            exit 1
          fi

          {
            echo "### Gate image"
            echo "Tags: $IMAGE:main, $IMAGE:$SHA_TAG"
            echo "Digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
