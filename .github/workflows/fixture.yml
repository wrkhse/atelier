# Proves each gate fails closed: one deliberate violation fails only its gate,
# and the restored code passes it. See fixtures/rust/README.md.
name: fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/image-resolve.yml
    permissions:
      contents: read
      packages: read
    with:
      # Transition only: remove this input after the main image is published.
      bootstrap: 1
  violation:
    name: "violation rust/${{ matrix.gate }}"
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt, clippy, test, mutants, kani, miri, msrv]
    defaults:
      run:
        shell: bash
    env:
      CI_SUPPORT: ${{ github.workspace }}/.github/ci
      SOURCE: ${{ github.workspace }}
      GATE: rust/${{ matrix.gate }}
      GATES: rust/${{ matrix.gate }}
      BASE: origin/main
      GATE_IMAGE: ghcr.io/${{ github.repository }}-gates@${{
        needs.image.outputs.digest }}
      GATE_IMAGE_HEAD: ${{ needs.image.outputs.head-ref == 'local' && 'local' ||
        format('ghcr.io/{0}-gates@{1}', github.repository,
        needs.image.outputs.digest) }}
      GATE_IMAGE_BOOTSTRAP: ${{ needs.image.outputs.bootstrap }}
    steps:
      - name: Fail if the image could not be resolved
        run: |
          if [[ "${{ needs.image.result }}" != success ]]; then
            echo "::error::gate image resolution failed; refusing to run the gate" \
              >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Reads .prototools and installs moon 2.6.5.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt,clippy,rust-src
      # Built before the violation, so the validator is the clean reporter.
      # It is static musl, so it runs in the bookworm gate image whatever
      # glibc the runner has.
      - name: Build reporter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p atelier-reporter \
            --target x86_64-unknown-linux-musl
      # The mutants gate diffs BASE...HEAD, so the violation is committed in
      # this checkout; the msrv violation edits the root Cargo.toml, so the
      # whole checkout is staged. target/ is not ignored, and holds the
      # reporter built above, so it is never staged or cleaned. Nothing is
      # pushed, and the job holds no credential.
      - name: Apply the violation
        run: |
          echo "CLEAN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          bash fixtures/violations/${{ matrix.gate }}.sh
          git add -A -- . ':(exclude)target'
          git -c user.name=fixture -c user.email=fixture@invalid \
            commit --quiet --message "test: $GATE violation"
      # A non-empty report shows moon ran the task, so a failure before the
      # gate, such as the image build, never counts as the expected one.
      - name: Expect the gate to fail
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          status=0
          bash "$CI_SUPPORT/run.sh" gate || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "::error::$GATE passed with its violation applied; it must fail"
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/atelier-reports/container/ci-report.json" ]]; then
            echo "::error::$GATE failed (exit $status) before moon wrote a report"
            exit 1
          fi
          echo "$GATE failed with its violation applied (exit $status), as expected"
      - name: Restore and expect the gate to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git reset --hard --quiet "$CLEAN_HEAD"
          git clean -fd --exclude=/target/
          if [[ -n "$(git status --porcelain -- . ':(exclude)target')" ]]; then
            echo "::error::the checkout is not restored to $CLEAN_HEAD"
            exit 1
          fi
          # A fresh report and reporter copy, so nothing from the failed run
          # is judged.
          rm -rf "$RUNNER_TEMP/atelier-reports" "$RUNNER_TEMP/atelier"
          if ! bash "$CI_SUPPORT/run.sh" gate; then
            echo "::error::$GATE failed on the restored code; it must pass"
            exit 1
          fi

      - name: Check gate image evidence
        if: ${{ !cancelled() }}
        env:
          REPORTS: ${{ runner.temp }}/atelier-reports
          EXPECTED: ${{ needs.image.outputs.digest }}
        run: |
          for name in image-digests.txt container-images.txt; do
            report="$REPORTS/$name"

            if [[ ! -f "$report" || ! -s "$report" ]]; then
              echo "::error::$name is missing or empty"
              exit 1
            fi
          done

          recorded=$(paste -sd, -- "$REPORTS/image-digests.txt")
          if [[ "$EXPECTED" == local ]]; then
            if ! grep -q ' local$' "$REPORTS/image-digests.txt"; then
              echo "::error::expected a ' local' digest line, recorded $recorded"
              exit 1
            fi
            echo "Local sentinel: a ' local' digest line is recorded" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$EXPECTED" ]] \
            || ! grep -qF -- "$EXPECTED" "$REPORTS/image-digests.txt"; then
            echo "::error::expected digest '$EXPECTED', recorded '$recorded'"
            exit 1
          fi

          {
            echo ""
            echo "### Gate image"
            echo ""
            cat "$REPORTS/image-digests.txt"
            cat "$REPORTS/container-images.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  # The msrv script refuses a rust-version it cannot trust before installing
  # anything: three small workspaces each fail it with their named reason,
  # and atelier's own workspace passes it.
  msrv-validation:
    name: msrv-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Expect each invalid rust-version to fail
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          script="$GITHUB_WORKSPACE/.moon/scripts/msrv.sh"

          # A workspace under $RUNNER_TEMP with the app crate; the root
          # src/lib.rs serves a root that is also a package.
          fixture() {
            local dir="$RUNNER_TEMP/msrv-$1"
            mkdir -p "$dir/src" "$dir/app/src"
            : > "$dir/src/lib.rs"
            : > "$dir/app/src/lib.rs"
            echo "$dir"
          }

          expect_failure() {
            local dir=$1 reason=$2 status=0 output
            output=$(MSRV_ROOT="$dir" MSRV_CHECK_ONLY=1 bash "$script" 2>&1) \
              || status=$?
            echo "$output"
            if [[ "$status" -eq 0 ]]; then
              echo "::error::msrv passed $dir; it must fail with $reason"
              exit 1
            fi
            if ! rg -q --fixed-strings -- "$reason" <<<"$output"; then
              echo "::error::msrv failed $dir (exit $status) without $reason"
              exit 1
            fi
          }

          bad=$(fixture bad)
          cat > "$bad/Cargo.toml" <<'EOF'
          [workspace]
          members = ["app"]
          resolver = "3"

          [workspace.package]
          rust-version = "1.1000"
          EOF
          cat > "$bad/app/Cargo.toml" <<'EOF'
          [package]
          name = "app"
          version = "0.1.0"
          edition = "2024"
          rust-version.workspace = true
          EOF
          expect_failure "$bad" "invalid rust-version"

          missing=$(fixture missing)
          cat > "$missing/Cargo.toml" <<'EOF'
          [workspace]
          members = ["app"]
          resolver = "3"

          [workspace.package]
          rust-version = "1.100"
          EOF
          cat > "$missing/app/Cargo.toml" <<'EOF'
          [package]
          name = "app"
          version = "0.1.0"
          edition = "2024"
          EOF
          expect_failure "$missing" "has no rust-version"

          # The root is a package too, so the workspace has two members.
          mismatch=$(fixture mismatch)
          cat > "$mismatch/Cargo.toml" <<'EOF'
          [package]
          name = "root"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.100"

          [workspace]
          members = ["app"]
          EOF
          cat > "$mismatch/app/Cargo.toml" <<'EOF'
          [package]
          name = "app"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.99"
          EOF
          expect_failure "$mismatch" "declares"

          output=$(MSRV_ROOT="$GITHUB_WORKSPACE" MSRV_CHECK_ONLY=1 bash "$script")
          if [[ "$output" != "msrv: 1.100" ]]; then
            echo "::error::msrv printed '$output' for atelier, not 'msrv: 1.100'"
            exit 1
          fi
          echo "$output"
