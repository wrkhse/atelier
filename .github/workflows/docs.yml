name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run; main's runs are never
# cancelled, so a deploy is never stopped halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Each page's "last updated" date comes from its history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Deploys the redirect from a fresh job, so nothing the site job's install or
  # build ran (a GITHUB_ENV or GITHUB_PATH entry, a changed file) reaches the
  # token. The Worker serves redirect/ from the checkout, not the VitePress
  # build, so no artifact crosses between the jobs.
  # A workflow_dispatch on main deploys too. A later push queues behind a
  # deploy in progress instead of cancelling it halfway.
  deploy:
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      # The locked deploy tools, cf and wrangler, without running any
      # package's install scripts; nothing is built here.
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: token
        name: Check for the deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy"
          fi
      - name: Deploy
        if: steps.token.outputs.present == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/cf deploy --message "${GITHUB_SHA}"
