# atelier checks itself: its gates, listed in .atelier/config.toml, each its
# own check, through gates.yml from this tree and atelier built from source.
name: atelier

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the run it superseded; a push
# to main is never cancelled.
concurrency:
  group: atelier-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # gates.yml's image job publishes the shared gate image to this repository's
  # package; every other job there asks for no more than contents: read.
  contents: read
  packages: write

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      atelier: source
