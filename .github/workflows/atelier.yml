# atelier runs its own gates: the gates workflow, .github/ci and the reporter
# all come from this commit, so review keeps a change from loosening them.
name: atelier

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    # A called workflow gets no more than its caller grants; the reporter
    # publishes one check per gate.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/gates.yml
