# atelier's own gates, run by atelier: `atelier gates` lists them, CI runs
# each as its own check, and builders' commits run the fixes.
checks = ["commands"]

[commands.fmt]
run = "cargo fmt --all -- --check"
fix = "cargo fmt --all"

[commands.clippy]
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[commands.nextest]
setup = ["curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C \"${CARGO_HOME:-$HOME/.cargo}/bin\""]
run = "RUSTFLAGS='-D warnings' cargo nextest run --workspace --all-targets --all-features --locked"

[commands.doctest]
run = "RUSTFLAGS='-D warnings' cargo test --workspace --doc --all-features --locked"

[commands.rustdoc]
run = "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked"

[commands.deny]
setup = ["cargo install --locked cargo-deny@0.20.2"]
run = "cargo deny check"

[commands.shear]
setup = ["cargo install --locked cargo-shear@1.14.0"]
run = "cargo shear"

[commands.mutants]
setup = [
  "curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C \"${CARGO_HOME:-$HOME/.cargo}/bin\"",
  "cargo install --locked cargo-mutants@27.1.0",
]
run = '''
set -e
mkdir -p target
git diff --no-ext-diff --no-textconv --no-color "$ATELIER_BASE" -- crates plugins > target/mutants.diff
cargo mutants --in-diff target/mutants.diff --timeout 120 --jobs 3
'''

# The workspace's declared rust-version, so the gate always checks the
# minimum Cargo.toml states; an absent or malformed one fails the gate.
# Keep the duplicated setup/run extraction and validation in sync.
[commands.msrv]
setup = ['''
msrv=$(awk -F'"' '
  /^[[:space:]]*\[/ {
    workspace = $0 ~ /^[[:space:]]*\[workspace[.]package\][[:space:]]*(#.*)?$/
  }
  workspace && /^[[:space:]]*rust-version[[:space:]]*=/ {
    if (found++ || $0 !~ /^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+(\.[0-9]+)?"[[:space:]]*(#.*)?$/) {
      invalid = 1
    } else {
      version = $2
    }
  }
  END {
    if (!found || invalid) exit 1
    print version
  }
' Cargo.toml) || {
  printf '%s\n' 'msrv: no valid [workspace.package] rust-version in Cargo.toml' >&2
  exit 1
}
rustup toolchain install "$msrv" --profile minimal
''']
run = '''
msrv=$(awk -F'"' '
  /^[[:space:]]*\[/ {
    workspace = $0 ~ /^[[:space:]]*\[workspace[.]package\][[:space:]]*(#.*)?$/
  }
  workspace && /^[[:space:]]*rust-version[[:space:]]*=/ {
    if (found++ || $0 !~ /^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+(\.[0-9]+)?"[[:space:]]*(#.*)?$/) {
      invalid = 1
    } else {
      version = $2
    }
  }
  END {
    if (!found || invalid) exit 1
    print version
  }
' Cargo.toml) || {
  printf '%s\n' 'msrv: no valid [workspace.package] rust-version in Cargo.toml' >&2
  exit 1
}
RUSTUP_AUTO_INSTALL=0 cargo +"$msrv" check --workspace --all-targets --all-features --locked
'''

[commands.kani]
setup = ["cargo install --locked kani-verifier --version 0.68.0", "cargo kani setup"]
run = "cargo kani -p atelier-core"

[commands.readmes]
run = "npx --yes prettier@3.9.10 --check README.md crates/README.md scripts/README.md site/README.md"

[commands.prettier]
root = "docs"
run = "npx --yes prettier@3.9.10 --check '**/*.md'"
fix = "npx --yes prettier@3.9.10 --write '**/*.md'"

[commands.ruff]
root = "scripts"
run = "pipx run ruff==0.17.4 format --check . && pipx run ruff==0.17.4 check ."
fix = "pipx run ruff==0.17.4 format ."

[commands.actionlint]
root = ".github"
run = "go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12"
