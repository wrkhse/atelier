[workspace]
members = ["reporter"]
resolver = "3"

[workspace.package]
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
repository = "https://github.com/wrkhse/atelier"

[workspace.dependencies]
# Keep CI's rc lockfile generation from selecting a newer clap version.
clap = { version = "=4.6.9", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
as_conversions = "deny"
too_many_lines = "deny"
