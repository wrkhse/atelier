# CI gates inherited by Rust projects.
taskOptions:
  runInCI: always
  cache: false

tasks:
  fmt:
    command: cargo fmt --all -- --check
  clippy:
    command: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  test:
    command: cargo test --workspace --all-features --locked
  kani:
    command: cargo kani --workspace
  miri:
    command: cargo +nightly-2026-08-21 miri test --workspace
    # The gate container is the boundary; the tests read the copied checkout.
    env:
      MIRIFLAGS: "-Zmiri-disable-isolation"
  mutants:
    script: |
      root=$(dirname "$(cargo locate-project --workspace --message-format plain)")
      bash "$root/.moon/scripts/mutants.sh"
  # Checks with the rust-version every workspace member declares, read and
  # validated from cargo metadata.
  msrv:
    script: |
      root=$(dirname "$(cargo locate-project --workspace --message-format plain)")
      bash "$root/.moon/scripts/msrv.sh"
