# atelier's own gates, seeded from .atelier/config.toml at f687307 (#87).
# moon ci runs each one; the reporter judges each moon result, and the gate
# job's status is the GitHub check.
taskOptions:
  runInCI: always
  cache: false

tasks:
  fmt:
    command: cargo fmt --all -- --check
  clippy:
    command: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  test:
    command: cargo test --workspace --all-features --locked
  kani:
    command: cargo kani -p atelier-reporter
  miri:
    command: cargo +nightly-2026-08-21 miri test -p atelier-reporter
    # The gate container is the boundary; the tests read the copied checkout.
    env:
      MIRIFLAGS: "-Zmiri-disable-isolation"
  mutants:
    command: cargo mutants --in-diff target/mutants.diff --timeout 120 --jobs 3
  # Checks with the rust-version Cargo.toml declares. moon runs the task from
  # reporter/, so the workspace manifest is ../Cargo.toml.
  msrv:
    script: |
      set -euo pipefail
      msrv=$(awk -F '"' '/^rust-version = "/ { print $2; exit }' ../Cargo.toml)
      if [[ -z "$msrv" ]]; then
        echo "../Cargo.toml declares no rust-version" >&2
        exit 1
      fi
      rustup toolchain install "$msrv" --profile minimal
      RUSTUP_AUTO_INSTALL=0 cargo +"$msrv" check --workspace --all-targets --all-features --locked
    # The script uses bash: [[ ]] and pipefail.
    options:
      unixShell: bash
