\* The second broken variant: a start that also empties a folder holding a
\* record it cannot act on, under the same bounds.
CONSTANT Pids = {2, 3}
CONSTANT Boots = {0, 1}
CONSTANT Stamp = 2

SPECIFICATION LooseSpec

\* Every variable stays in its domain.
INVARIANT TypeOK

\* A process atelier started, and still leading its group, is still named by
\* the folder: emptying a folder whose record atelier cannot act on is what
\* breaks it, and two states reach it.
INVARIANT NoOrphanedLeader

\* Every signal names a process atelier started a group for.
INVARIANT NoUnconfirmedSignal

\* As for the good module.
CHECK_DEADLOCK FALSE
